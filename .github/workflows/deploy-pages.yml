# Déploiement sur GitHub Pages (ADR 0005).
# À chaque mise à jour de main : vérifications (types, lint, tests unitaires),
# build servi sous /epicerie/, puis publication. Si une vérification échoue,
# rien n'est publié et la version en ligne reste la précédente.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Par défaut, le jeton ne peut que lire le code.
permissions:
  contents: read

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vérifier (types, lint, tests unitaires)
        run: npm run check

      - name: Construire pour /epicerie/
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Seul ce job peut publier sur Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
